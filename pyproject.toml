[project]
name = "dagster-questdb-boilerplate"
version = "0.1.0"
description = "Dagster + QuestDB starter boilerplate"
readme = "README.md"
authors = [
    { name = "Marius Kraft", email = "kraft.marius@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
]

[project.scripts]
dagster-questdb-boilerplate = "dagster_questdb_boilerplate:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.75",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["dagster_questdb_boilerplate"]
